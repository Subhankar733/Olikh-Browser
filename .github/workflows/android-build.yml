name: Olikh-Browser Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Verify Android SDK
        run: |
          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar" || {
            echo "::error::Android SDK Platform 37 is not installed."
            exit 1
          }

          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt2" || {
            echo "::error::Android SDK Build Tools 37.0.0 is not installed."
            exit 1
          }

          test -x "$ANDROID_HOME/platform-tools/adb" || {
            echo "::error::Android SDK Platform-Tools is not installed."
            exit 1
          }

          echo "Android SDK Platform 37: OK"
          echo "Android SDK Build Tools 37.0.0: OK"
          echo "Android SDK Platform-Tools: OK"
      - name: Clean project
        run: |
          gradle --no-daemon clean

      - name: Build Debug APK
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace \
            --warning-mode all

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Olikh-Browser-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Olikh-Browser-build-reports-${{ github.run_number }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
