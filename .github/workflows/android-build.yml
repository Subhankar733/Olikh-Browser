name: Olikh-Browser Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Lint & Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Verify build environment
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar" || {
            echo "::error::Android SDK Platform 37 is not installed."
            exit 1
          }

          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt2" || {
            echo "::error::Android SDK Build Tools 37.0.0 is not installed."
            exit 1
          }

          test -x "$ANDROID_HOME/platform-tools/adb" || {
            echo "::error::Android SDK Platform-Tools is not installed."
            exit 1
          }

          echo "Android SDK Platform 37: OK"
          echo "Android SDK Build Tools 37.0.0: OK"
          echo "Android SDK Platform-Tools: OK"

      - name: Run tests, lint and build
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            --stacktrace \
            --warning-mode all

      - name: Verify APK output
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not produced."
            exit 1
          fi

          APK_SIZE="$(stat -c '%s' "$APK")"
          APK_SIZE_MB="$(awk \
            "BEGIN { printf \"%.2f\", $APK_SIZE / 1024 / 1024 }")"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          printf '%s  %s\n' \
            "$SHA256" \
            "$(basename "$APK")" \
            > app/build/outputs/apk/debug/SHA256SUMS.txt

          {
            echo "## OLIKH Browser CI"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::12}\` |"
            echo "| Branch/Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| APK | \`$(basename "$APK")\` |"
            echo "| APK size | \`${APK_SIZE_MB} MB\` |"
            echo "| SHA-256 | \`$SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "APK: $APK"
          echo "Size: ${APK_SIZE_MB} MB"
          echo "SHA-256: $SHA256"

      - name: Validate APK
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK not found."
            exit 1
          fi

          echo "===== APK SIGNATURE ====="
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"

          echo "===== APK CERTIFICATE ====="
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"

          echo "===== APK PACKAGE ====="
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK"

          echo "===== APK FILE ====="
          ls -lh "$APK"

          echo "APK validation: OK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Olikh-Browser-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Olikh-Browser-build-reports-${{ github.run_number }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
